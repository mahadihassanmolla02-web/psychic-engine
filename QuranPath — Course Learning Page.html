<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>৬০০ মিনিটে কুরআন শিখি — ফ্রি ক্লাস</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{--bg:#f6f1e4;--surface:#fffdf6;--ink:#1d2b24;--muted:#5d6b63;--green:#0f5b43;--green2:#0b3f2f;--gold:#b98a2e;--line:#e4d9bb;--on-green:#fffdf6;--red:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a15;--surface:#14251e;--ink:#eee8d5;--muted:#a3b2a9;--green:#1b7d5d;--green2:#08241b;--gold:#d9ae55;--line:#2a4136;--red:#ff7a6b}}
:root[data-theme="dark"]{--bg:#0d1a15;--surface:#14251e;--ink:#eee8d5;--muted:#a3b2a9;--green:#1b7d5d;--green2:#08241b;--gold:#d9ae55;--line:#2a4136;--red:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.6}
.top{background:linear-gradient(180deg,var(--green2),var(--green));color:var(--on-green);padding:14px 16px;display:flex;align-items:center;gap:12px}
.top a{color:var(--on-green);text-decoration:none;font-size:14px;opacity:.9}
.top h1{margin:0;font-size:clamp(16px,4.2vw,21px);flex:1;line-height:1.35}
.badge{background:var(--gold);color:#1d1606;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:16px 14px 90px;display:grid;gap:16px}
.stage{position:relative;aspect-ratio:16/9;background:#06130e;border-radius:16px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.2)}
.stage video{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}
.stage.playing video{display:block}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fffdf6;text-align:center;padding:12px;border:0;width:100%;cursor:pointer;font-family:inherit;background:radial-gradient(circle at 50% 40%,var(--c1,#1b7d5d),var(--c2,#08241b))}
.stage.playing .cover{display:none}
.cover .ar{font-family:Amiri,serif;font-size:clamp(22px,6vw,40px);color:#e8c878}
.play{width:68px;height:68px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(217,174,85,.25)}
.play svg{width:28px;height:28px;margin-left:4px;fill:#1d1606}
.cover small{opacity:.85;font-size:13px}
.soon{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#e8c878}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.bar h2{margin:0;font-size:19px;flex:1 1 200px}
.ctl{display:flex;gap:8px}
.chip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:600 14px "Hind Siliguri",sans-serif;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip:disabled{opacity:.4;cursor:default}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
h3.sec{margin:6px 0 0;font-size:18px;color:var(--green)}
.free{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vc{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font-family:inherit;color:inherit;display:block;width:100%}
.vc.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,138,46,.25)}
.th{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--c1),var(--c2));color:#e8c878;font-family:Amiri,serif;font-size:26px}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .mini{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font:600 12px "Hind Siliguri";border-radius:6px;padding:1px 7px}
.th .fb{position:absolute;left:8px;top:8px;background:var(--gold);color:#1d1606;font:700 11px "Hind Siliguri";border-radius:6px;padding:1px 8px}
.vc .t{padding:10px 12px;font-weight:600;font-size:15px;line-height:1.4}
.vc .t span{display:block;color:var(--muted);font-weight:400;font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;font-family:inherit;color:inherit;text-align:left;cursor:pointer;font-size:15px}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(185,138,46,.08)}
.row .n{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.row .lk{margin-left:auto;color:var(--muted);flex:none}
.row.cur .n{background:var(--gold);color:#1d1606}
.row.lock{color:var(--muted)}
.buy{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center;z-index:5}
.price{display:flex;align-items:baseline;gap:8px}
.old{color:var(--red);text-decoration:line-through}
.new{color:var(--green);font-weight:700;font-size:22px}
.btn{background:var(--gold);color:#1d1606;border:0;border-radius:10px;padding:11px 22px;font:700 16px "Hind Siliguri",sans-serif;text-decoration:none;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:9;padding:16px}
.modal.on{display:grid}
.mb{background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:22px;max-width:380px;text-align:center}
.mb h4{margin:0 0 6px;font-size:20px}
.mb p{margin:0 0 14px;color:var(--muted)}
.mb .x{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <a href="index.html" id="back">← সব কোর্স</a>
  <h1>৬০০ মিনিটে কুরআন শিখি</h1>
  <span class="badge">ফ্রি প্রিভিউ</span>
</header>

<main>
  <div class="stage" id="stage">
    <video id="vid" controls playsinline preload="none" controlslist="nodownload"></video>
    <button class="cover" id="cover" aria-label="ভিডিও চালু করুন">
      <span class="ar">بِسْمِ ٱللَّهِ</span>
      <span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>
      <small id="cvt"></small>
      <span class="soon" id="soon" hidden>ভিডিও লিংক যুক্ত করা হলে এখানে চলবে</span>
    </button>
  </div>

  <div class="bar">
    <h2 id="ttl"></h2>
    <div class="ctl">
      <button class="chip" id="prev">← আগের</button>
      <button class="chip" id="spd">১x</button>
      <button class="chip" id="next">পরের →</button>
    </div>
  </div>
  <div class="prog" aria-hidden="true"><i id="pg"></i></div>

  <h3 class="sec">🎬 ফ্রি দেখুন (২টি ক্লাস)</h3>
  <div class="free" id="free"></div>

  <h3 class="sec">📚 কোর্সের বাকি ক্লাস</h3>
  <div class="list" id="list"></div>
</main>

<div class="buy">
  <div class="price"><span class="old">১৫০০ টাকা</span><span class="new">৫০০ টাকা</span></div>
  <a class="btn" href="index.html#checkout" id="buy">এখনই কিনুন</a>
</div>

<div class="modal" id="modal">
  <div class="mb">
    <h4>🔒 এই ক্লাসটি লক করা</h4>
    <p>সম্পূর্ণ কোর্সের সব ক্লাস, কুইজ ও বোনাস মাশক্ব ক্লাস দেখতে কোর্সটি কিনুন।</p>
    <a class="btn" href="index.html#checkout" style="display:inline-block">৫০০ টাকায় কিনুন</a>
    <button class="x" id="mx">পরে দেখব</button>
  </div>
</div>

<script>
/* ===== এখানে ভিডিও ও থাম্বনেইল বসান =====
   src   = ভিডিও ফাইলের লিংক (mp4)
   thumb = থাম্বনেইল ছবির লিংক অথবা data: URI (ফাঁকা থাকলে ডিফল্ট ডিজাইন) */
var FREE=[
 {t:'ক্লাস ১: আরবি হরফ পরিচিতি',d:'১০ মিনিট',src:'',thumb:'',c1:'#1b7d5d',c2:'#08241b',ar:'ا ب ت'},
 {t:'ক্লাস ২: যবর, যের, পেশ',d:'১২ মিনিট',src:'',thumb:'',c1:'#b98a2e',c2:'#4a3410',ar:'بَ بِ بُ'}
];
var LOCKED=['ক্লাস ৩: মুশকিল হরফের উচ্চারণ','ক্লাস ৪: যুক্ত হরফ চেনা','ক্লাস ৫: তানবীন ও সাকিন','ক্লাস ৬: মাদ্দের নিয়ম','ক্লাস ৭: গুন্নাহ ও তাশদীদ','ক্লাস ৮: সূরা আল-ফাতিহা','ক্লাস ৯: সূরা আল-ইখলাস','🎁 বোনাস: নামাজের ১০টি সূরার মাশক্ব'];
var BN='০১২৩৪৫৬৭৮৯';
function bn(n){return String(n).replace(/\d/g,function(d){return BN[d]})}
function $(i){return document.getElementById(i)}
var cur=0,vid=$('vid'),stage=$('stage');
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function render(){
  var f=$('free');f.innerHTML='';
  FREE.forEach(function(v,i){
    var b=document.createElement('button');b.className='vc'+(i===cur?' on':'');
    b.innerHTML='<div class="th">'+(v.thumb?'<img alt="" src="'+v.thumb+'">':v.ar)+'<span class="fb">ফ্রি</span><span class="mini">'+v.d+'</span></div><div class="t">'+v.t+'<span>'+(store.get('qp_done'+i)?'✅ দেখা হয়েছে':'▶ দেখতে ক্লিক করুন')+'</span></div>';
    b.style.setProperty('--c1',v.c1);b.style.setProperty('--c2',v.c2);
    b.onclick=function(){select(i,true)};
    f.appendChild(b);
  });
  var l=$('list');l.innerHTML='';
  FREE.forEach(function(v,i){l.appendChild(row(i+1,v.t,i===cur,false,function(){select(i,true)}))});
  LOCKED.forEach(function(t,i){l.appendChild(row(FREE.length+i+1,t,false,true,function(){$('modal').classList.add('on')}))});
}
function row(n,t,on,lock,fn){
  var r=document.createElement('button');r.className='row'+(on?' cur':'')+(lock?' lock':'');
  r.innerHTML='<span class="n">'+bn(n)+'</span><span>'+t+'</span><span class="lk">'+(lock?'🔒':'▶')+'</span>';
  r.onclick=fn;return r;
}
function select(i,play){
  cur=i;var v=FREE[i];
  vid.pause();stage.classList.remove('playing');
  vid.removeAttribute('src');
  if(v.src)vid.src=v.src;
  vid.poster=v.thumb||'';
  var c=$('cover');c.style.setProperty('--c1',v.c1);c.style.setProperty('--c2',v.c2);
  $('cvt').textContent=v.t+' • '+v.d;$('ttl').textContent=v.t;
  $('soon').hidden=!!v.src;
  $('prev').disabled=i===0;$('next').disabled=i===FREE.length-1;
  $('pg').style.width='0';
  store.set('qp_cur',i);render();
  if(play)startPlay();
}
function startPlay(){
  if(!FREE[cur].src){$('soon').hidden=false;return}
  stage.classList.add('playing');
  var t=parseFloat(store.get('qp_t'+cur)||0);
  vid.playbackRate=rates[ri];
  vid.onloadedmetadata=function(){if(t>3&&t<vid.duration-5)vid.currentTime=t};
  var p=vid.play();if(p&&p.catch)p.catch(function(){});
}
$('cover').onclick=startPlay;
vid.ontimeupdate=function(){
  if(vid.duration){$('pg').style.width=(vid.currentTime/vid.duration*100)+'%';store.set('qp_t'+cur,vid.currentTime)}
};
vid.onended=function(){
  store.set('qp_done'+cur,'1');store.set('qp_t'+cur,0);
  if(cur<FREE.length-1){select(cur+1,true)}else{render();$('modal').classList.add('on')}
};
var rates=[1,1.25,1.5,2,0.75],ri=0;
$('spd').onclick=function(){ri=(ri+1)%rates.length;vid.playbackRate=rates[ri];$('spd').textContent=bn(rates[ri])+'x'};
$('prev').onclick=function(){if(cur>0)select(cur-1,true)};
$('next').onclick=function(){if(cur<FREE.length-1)select(cur+1,true)};
$('mx').onclick=function(){$('modal').classList.remove('on')};
$('modal').onclick=function(e){if(e.target===this)this.classList.remove('on')};
select(Math.min(parseInt(store.get('qp_cur')||0)||0,FREE.length-1),false);
</script>
</body>
</html>
