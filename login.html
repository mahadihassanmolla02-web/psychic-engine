
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuranPath - Student Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7f4;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 35px;
  border-radius: 18px;
  box-shadow: 0 8px 35px #00000012;
}

.logo {
  text-align: center;
  color: #087b50;
  font-size: 30px;
  font-weight: bold;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 28px;
}

h2 {
  text-align: center;
  color: #222;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
  background: #087b50;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.links {
  text-align: center;
  margin-top: 20px;
}

a {
  color: #087b50;
  cursor: pointer;
  text-decoration: none;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.6;
}

#dashboard {
  display: none;
  text-align: center;
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">QuranPath</div>
  <p class="subtitle">৬০০ মিনিটে কুরআন শিখি</p>

  <section id="authSection">

    <h2 id="formTitle">Student Login</h2>

    <form id="authForm">

      <input
        type="text"
        id="name"
        placeholder="আপনার নাম"
        hidden
      >

      <input
        type="email"
        id="email"
        placeholder="ইমেইল ঠিকানা"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="পাসওয়ার্ড"
        required
        minlength="6"
      >

      <button type="submit" id="submitBtn">
        Login
      </button>

    </form>

    <div class="links">

      <p id="registerLink">
        নতুন শিক্ষার্থী?
        <a id="showRegister">অ্যাকাউন্ট তৈরি করুন</a>
      </p>

      <p id="loginLink" hidden>
        অ্যাকাউন্ট আছে?
        <a id="showLogin">লগইন করুন</a>
      </p>

      <p>
        <a id="forgotPassword">পাসওয়ার্ড ভুলে গেছেন?</a>
      </p>

    </div>

  </section>

  <section id="dashboard">

    <h2>স্বাগতম!</h2>
    <p id="studentEmail"></p>
    <p>আপনি সফলভাবে QuranPath-এ লগইন করেছেন।</p>

    <button id="logoutBtn">Logout</button>

  </section>

  <div id="message"></div>

</div>

<script type="module">

import { supabase } from './supabase-config.js';

const authSection = document.getElementById('authSection');
const dashboard = document.getElementById('dashboard');
const authForm = document.getElementById('authForm');

const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');

const submitBtn = document.getElementById('submitBtn');
const message = document.getElementById('message');

let mode = 'login';

function showMessage(text, color = 'green') {
  message.textContent = text;
  message.style.color = color;
}

function setMode(newMode) {
  mode = newMode;

  nameInput.hidden = mode !== 'register';

  document.getElementById('formTitle').textContent =
    mode === 'register' ? 'Student Registration' : 'Student Login';

  submitBtn.textContent =
    mode === 'register' ? 'Create Account' : 'Login';

  document.getElementById('registerLink').hidden =
    mode === 'register';

  document.getElementById('loginLink').hidden =
    mode !== 'register';

  document.getElementById('forgotPassword').parentElement.hidden =
    mode !== 'login';

  showMessage('');
}

document.getElementById('showRegister').onclick = () =>
  setMode('register');

document.getElementById('showLogin').onclick = () =>
  setMode('login');

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  submitBtn.disabled = true;
  showMessage('অপেক্ষা করুন...');

  try {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    let result;

    if (mode === 'register') {

      const name = nameInput.value.trim();

      if (!name) {
        throw new Error('আপনার নাম লিখুন।');
      }

      result = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: name
          }
        }
      });

      if (result.error) throw result.error;

      if (result.data.session) {
        showMessage('অ্যাকাউন্ট তৈরি হয়েছে!');
        showDashboard(result.data.user);
      } else {
        showMessage(
          'রেজিস্ট্রেশন সফল! আপনার ইমেইল চেক করে অ্যাকাউন্ট নিশ্চিত করুন।'
        );
      }

    } else {

      result = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (result.error) throw result.error;

      showMessage('লগইন সফল!');
      showDashboard(result.data.user);
    }

  } catch (error) {
    showMessage(error.message, 'red');
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById('forgotPassword').onclick =
async () => {

  const email = emailInput.value.trim();

  if (!email) {
    showMessage('প্রথমে আপনার ইমেইল লিখুন।', 'red');
    return;
  }

  try {
    const { error } =
      await supabase.auth.resetPasswordForEmail(email);

    if (error) throw error;

    showMessage('পাসওয়ার্ড রিসেটের লিংক ইমেইলে পাঠানো হয়েছে।');

  } catch (error) {
    showMessage(error.message, 'red');
  }
};

function showDashboard(user) {
  authSection.style.display = 'none';
  dashboard.style.display = 'block';

  document.getElementById('studentEmail').textContent =
    user.email || '';
}

document.getElementById('logoutBtn').onclick =
async () => {

  const { error } = await supabase.auth.signOut();

  if (error) {
    showMessage(error.message, 'red');
    return;
  }

  dashboard.style.display = 'none';
  authSection.style.display = 'block';

  authForm.reset();
  setMode('login');

  showMessage('আপনি লগআউট করেছেন।');
};

async function checkLogin() {
  const { data, error } = await supabase.auth.getSession();

  if (error) {
    showMessage(error.message, 'red');
    return;
  }

  if (data.session) {
    showDashboard(data.session.user);
  }
}

checkLogin();

</script>

</body>
</html>
